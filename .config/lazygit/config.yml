promptToReturnFromSubprocess: false

gui:
  expandFocusedSidePanel: true

keybinding:
  commits:
    moveDownCommit: 'J'
    moveUpCommit: 'K'

customCommands:
  - key: "C"
    context: "files"
    description: "AI commit message"
    command: "autocommit"
    output: terminal
  - key: "#"
    context: "global"
    description: "Net lines in uncommitted changes"
    command: "git-netlines"
    output: popup
    outputTitle: "Total uncommitted lines for all files"
